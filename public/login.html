<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Graph CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/@simplewebauthn/browser@13.3.0/dist/bundle/index.umd.min.js"></script>
</head>
<body>
  <div id="login-overlay" class="welcome-overlay">
    <div class="welcome-card">
      <h1>Graph CRM</h1>

      <div id="login-mode" class="hidden">
        <p>Sign in with your passkey.</p>
        <button type="button" id="login-btn" class="primary">Sign in with passkey</button>
      </div>

      <div id="register-mode" class="hidden">
        <p>No passkey has been set up yet. Create one to secure this CRM — Face ID, Touch ID, a security key, or your device screen lock all work.</p>
        <input type="text" id="register-name" placeholder="Your name" />
        <button type="button" id="register-btn" class="primary" style="margin-top: 12px;">Create passkey</button>
      </div>

      <div id="login-error" class="import-result error"></div>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
